name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

     - uses: Platane/snk@v3
  with:
    github_user_name: chandru4527
    outputs: |
      dist/matrix.svg?color_snake=#39ff14&color_dots=#000000,#001a00,#003300,#006600,#39ff14

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
